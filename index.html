<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a0b2e" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 8 8%22%3E%3Ccircle cx=%224%22 cy=%224%22 r=%223.5%22 fill=%22%23ff9800%22/%3E%3C/svg%3E" />
  <title>Xochimilco de Muertos</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0d0d; overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
    #jump {
      position: fixed; display: none; width: 88px; height: 88px; border-radius: 50%;
      border: 4px solid #ff9800; background: rgba(46, 26, 71, 0.75); color: #ffc04d;
      font: bold 16px/1 monospace; letter-spacing: 1px; touch-action: none; -webkit-tap-highlight-color: transparent;
      box-shadow: 0 0 0 4px #1a0b2e;
    }
    #jump.down { background: #e0218a; color: #f4ecd8; }
    #rotate {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
      background: #1a0b2e; color: #ffc04d; font: bold 18px/1.6 monospace; text-align: center; padding: 24px; z-index: 10;
    }
    #rotate .phone { width: 40px; height: 70px; border: 4px solid #ff9800; border-radius: 6px; margin-bottom: 20px;
      animation: rot 1.6s ease-in-out infinite; }
    #about { position: fixed; top: 10px; left: 10px; z-index: 5; padding: 6px 10px; border: 2px solid #ff9800;
      background: rgba(26, 11, 46, 0.85); color: #ffc04d; font: bold 13px/1 monospace; text-decoration: none; letter-spacing: 1px; }
    #about:hover { background: #e0218a; color: #f4ecd8; }
    body.playing #about { display: none; }
    @keyframes rot { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <a id="about" href="./about.html" onpointerdown="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()" onclick="event.stopPropagation()">ABOUT / CÓMO SE JUEGA</a>
  <button id="jump" aria-label="Jump">JUMP</button>
  <div id="rotate"><div class="phone"></div>GIRA TU TELÉFONO<br /><small>Rotate your phone to landscape</small></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
